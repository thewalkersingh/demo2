server:
  port: 8080

spring:
  application:
    name: healix

  datasource:
    url: jdbc:mysql://localhost:3306/healix_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: root
    password: admin
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: false
#  sql:
#    init:
#      mode: always # Options: always, never, embedded
#      data-location: classpath:/data.sql


springdoc:
  swagger-ui:
    enable: true
    path: /swagger-ui.html
  api-docs:
    enable: true
    path: /api-docs

logging:
  level:
    com.helix: DEBUG
#    org.springframework.security: DEBUG